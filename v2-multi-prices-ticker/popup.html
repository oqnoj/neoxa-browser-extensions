<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 240px;
      max-height: 350px;
      overflow-y: auto;
      padding: 14px;
      background: #1e1e1e;
      color: #ffffff;
      margin: 0;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 13px;
      color: #8ab4f8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-align: center;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #2d2d2d;
      font-size: 13px;
    }
    .token-name { font-weight: bold; color: #fff; }
    .token-price { color: #51cf66; font-family: monospace; }
    .controls {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }
    button {
      flex: 1;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
    }
    button:hover { background: #2563eb; }
    .settings-btn { background: #4b5563; }
    .settings-btn:hover { background: #374151; }
  </style>
</head>
<body>
  <h3>Neoxa Prices</h3>
  <div id="prices-container">Loading prices...</div>
  
  <div class="controls">
    <button id="refresh-btn">🔄 Refresh</button>
    <button id="settings-btn" class="settings-btn">⚙️ Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
